apis:
- aid: cafex-communications:audit-events
  name: CafeX Audit Events API
  description: 'The CafeX Audit Events API allows the retrieval of audit event data for CafeX
    tenants. Events can be filtered by a required time range and by optional service, event type,
    action, user, app, workspace, conference session, message, change and secondary-attribute
    filters, and are returned as a paged array of event objects with a continuation token. Access is
    secured with an OAuth 2.0 client-credentials bearer token issued by the CafeX authorization
    server; tokens are valid for 8 hours and events are retained for a maximum of one year.'
  humanURL: https://support.cafex.com/support/solutions/articles/73000645442-accessing-audit-information-programmatically
