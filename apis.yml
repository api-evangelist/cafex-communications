aid: cafex-communications
name: CafeX Communications
description: 'CafeX Communications, Inc. is a US-headquartered software company (founded 2013)
  that builds a low-code platform for developing intelligent applications and agentic systems for
  regulated industries — banking, insurance, healthcare and government. The current CafeX AI platform
  is delivered as a multi-tenant SaaS at app.cafex.com and is organised into App Studio (App Builder,
  Flow Builder, Rule Builder, Data Tables and API Lab), Data Studio (Data AI, Data Gateway, Data
  Visualizer) and Agent Studio (Agent Builder, LM Insights). CafeX began life as a WebRTC and
  embedded-communications vendor (Fusion Client, Live Assist, CafeX Meetings, later the Challo
  collaboration workspace) and has since repositioned around AI workflow and process automation.
  Its one publicly documented, publicly callable API is the CafeX Audit Events API, a tenant-scoped
  REST search endpoint for audit event data secured with OAuth 2.0 client credentials.'
